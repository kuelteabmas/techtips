<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta charset="UTF-8" />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'TechTips',
        repo: 'https://github.com/kuelteabmas/techtips',
        homepage: 'index.md',
        loadSidebar: '_sidebar.md',
        alias: {
          '/.*/_sidebar.md': '/_sidebar.md'
        },

         // Sidebar Configuration
        auto2top: true, // Scrolls to the top of the screen when the route is changed
        // loadSidebar: true,
        maxLevel: 0,
        // Set subMaxLevel to 0 to remove automatic display of page table of contents (TOC) in Sidebar
        subMaxLevel: 0,
        
            // Search Plugin Configuration
        search: {
            placeholder: 'Type to search',
            noData: 'No matches found.',
            // Headline depth, 1 - 6
            depth: 2,
        }
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
